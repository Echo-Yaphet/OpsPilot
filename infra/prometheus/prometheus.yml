global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: services
    metrics_path: /metrics
    static_configs:
      - targets: [user-service:8001, order-service:8002, payment-service:8003]
  - job_name: container-metrics
    metrics_path: /metrics
    static_configs:
      - targets: [container-metrics-exporter:9101]
  - job_name: runtime-executor
    metrics_path: /metrics
    static_configs:
      - targets: [runtime-executor:2375]
  - job_name: promtail
    metrics_path: /metrics
    static_configs:
      - targets: [promtail:9080]
