groups:
  - name: opspilot
    rules:
      - alert: RedisDependencyDown
        expr: dependency_up{dependency="redis"} == 0
        for: 10s
        labels: {severity: critical}
        annotations:
          summary: "Redis is unavailable to {{ $labels.service }}"
      - alert: MySQLDependencyDown
        expr: dependency_up{dependency="mysql"} == 0
        for: 10s
        labels: {severity: critical}
        annotations:
          summary: "MySQL is unavailable to {{ $labels.service }}"
      - alert: ContainerHighCPU
        expr: container_cpu_usage_ratio > on(service) container_cpu_alert_threshold_ratio
        for: 10s
        labels: {severity: warning}
        annotations:
          summary: "Container CPU usage is high on {{ $labels.service }}"
      - alert: ContainerMetricsExporterDown
        expr: up{job="container-metrics"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "Container metrics exporter is unavailable"
      - alert: ContainerMetricsCollectionFailed
        expr: container_cpu_metrics_up == 0
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "Container CPU collection failed for {{ $labels.service }}"
      - alert: ContainerMetricsDataStale
        expr: (time() - container_cpu_metrics_last_success_timestamp_seconds > 60) and (container_cpu_metrics_last_success_timestamp_seconds > 0)
        labels: {severity: warning}
        annotations:
          summary: "Container CPU metrics are stale for {{ $labels.service }}"
      - alert: LogTargetPublicationFailed
        expr: docker_proxy_log_target_publication_up == 0
        for: 15s
        labels: {severity: warning}
        annotations:
          summary: "Promtail log target publication is failing"
      - alert: LogTargetsStale
        expr: (time() - docker_proxy_log_target_publication_last_success_timestamp_seconds > 30) and (docker_proxy_log_target_publication_last_success_timestamp_seconds > 0)
        labels: {severity: warning}
        annotations:
          summary: "Promtail log targets are stale"
      - alert: LokiLogIngestionStale
        expr: (up{job="promtail"} == 0) or on() (sum(increase(promtail_sent_entries_total[1m])) == 0)
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "Loki log ingestion is stale"
      - record: opspilot_service_log_read_fresh
        expr: |
          (
            sum by (service) (
              increase(promtail_read_lines_total[1m])
              * on (path) group_left(service)
                docker_proxy_log_target_info
            ) > bool 0
          )
          or
          (
            max by (service) (docker_proxy_log_target_info) * 0
          )
          or
          max by (service) (
            label_replace(
              sum by (compose_service) (
                increase(promtail_runtime_forwarded_lines_total[1m])
              ) > bool 0,
              "service", "$1", "compose_service", "(.+)"
            )
            or
            label_replace(vector(0), "service", "payment-service", "", "")
          )
      - alert: ServiceLogCollectionStale
        expr: opspilot_service_log_read_fresh == 0
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "Promtail log collection is stale for {{ $labels.service }}"
