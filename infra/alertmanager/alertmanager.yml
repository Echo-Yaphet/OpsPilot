global:
  resolve_timeout: 1m

route:
  receiver: opspilot-control-api
  group_by: [alertname, service]
  group_wait: 1s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: opspilot-control-api
    webhook_configs:
      - url: http://control-api:8080/api/v1/alertmanager/webhook
        send_resolved: true
