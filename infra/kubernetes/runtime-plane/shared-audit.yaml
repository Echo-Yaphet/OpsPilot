apiVersion: v1
kind: Service
metadata: {name: runtime-audit-db}
spec:
  selector: {app.kubernetes.io/name: runtime-audit-db}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: runtime-audit-db}
spec:
  serviceName: runtime-audit-db
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: runtime-audit-db}
  template:
    metadata:
      labels: {app.kubernetes.io/name: runtime-audit-db}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 999}
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: opspilot_runtime}
            - {name: POSTGRES_USER, value: opspilot_runtime}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: runtime-audit-database, key: password}}}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "opspilot_runtime", "-d", "opspilot_runtime"]}
            periodSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 999
            runAsGroup: 999
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
