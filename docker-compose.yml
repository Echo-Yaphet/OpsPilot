name: opspilot

x-service-common: &service-common
  restart: unless-stopped
  networks: [opspilot]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  workload-identity-bootstrap:
    build:
      context: .
      dockerfile: apps/workload-identity-issuer/Dockerfile
    command: ["python", "/app/bootstrap.py"]
    restart: "no"
    volumes:
      - workload-issuer-private:/identity/issuer-private
      - workload-issuer-public:/identity/issuer-public
      - workload-control-private:/identity/control-private
      - workload-control-public:/identity/control-public
      - workload-gateway-private:/identity/gateway-private
      - workload-gateway-public:/identity/gateway-public
      - workload-metrics-private:/identity/metrics-private
      - workload-metrics-public:/identity/metrics-public

  workload-identity-issuer:
    <<: *service-common
    build:
      context: .
      dockerfile: apps/workload-identity-issuer/Dockerfile
    environment:
      WORKLOAD_IDENTITY_SIGNING_KEY_FILE: /identity/issuer-private/private.pem
      WORKLOAD_IDENTITY_DATABASE_PATH: /data/issuer.db
      WORKLOAD_IDENTITY_CLIENT_KEYS: '{"control-api":"/identity/control-public/public.pem","executor-gateway":"/identity/gateway-public/public.pem","container-metrics-exporter":"/identity/metrics-public/public.pem"}'
      WORKLOAD_IDENTITY_TARGET_PLACEMENTS: '{"redis":"local-compose","mysql":"local-compose","user-service":"local-compose","order-service":"local-compose","payment-service":"local-compose","prometheus":"local-compose","alertmanager":"local-compose","loki":"local-compose"}'
    volumes:
      - workload-issuer-private:/identity/issuer-private:ro
      - workload-control-public:/identity/control-public:ro
      - workload-gateway-public:/identity/gateway-public:ro
      - workload-metrics-public:/identity/metrics-public:ro
      - workload-issuer-data:/data
    networks: [opspilot, executor-runtime]
    depends_on:
      workload-identity-bootstrap: {condition: service_completed_successfully}

  dashboard:
    <<: *service-common
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    environment:
      NEXT_PUBLIC_OPSPILOT_API: http://localhost:8080
    ports: ["3001:3001"]
    depends_on: [control-api]

  user-service:
    <<: *service-common
    pid: service:runtime-actuator-user
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    environment:
      SERVICE_NAME: user-service
      PORT: 8001
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: opspilot
      MYSQL_PASSWORD: opspilot
      MYSQL_DATABASE: opspilot
      REDIS_URL: redis://redis:6379/0
    ports: ["8001:8001"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      promtail: {condition: service_started}
      runtime-actuator-user: {condition: service_started}
    logging:
      driver: syslog
      options:
        syslog-address: ${PROMTAIL_SYSLOG_ADDRESS:-tcp+tls://host.docker.internal:1514}
        syslog-format: rfc5424micro
        syslog-tls-ca-cert: ${RUNTIME_LOG_SECRET_DIR:-/Users/yaphet/code/OpsPilot/work/runtime-log-secrets}/current/clients/user-service/ca.pem
        syslog-tls-cert: ${RUNTIME_LOG_SECRET_DIR:-/Users/yaphet/code/OpsPilot/work/runtime-log-secrets}/current/clients/user-service/cert.pem
        syslog-tls-key: ${RUNTIME_LOG_SECRET_DIR:-/Users/yaphet/code/OpsPilot/work/runtime-log-secrets}/current/clients/user-service/key.pem
        syslog-tls-skip-verify: "false"
        tag: '${COMPOSE_PROJECT_NAME:-opspilot}|user-service'

  order-service:
    <<: *service-common
    pid: service:runtime-actuator-order
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    environment:
      SERVICE_NAME: order-service
      PORT: 8002
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: opspilot
      MYSQL_PASSWORD: opspilot
      MYSQL_DATABASE: opspilot
      REDIS_URL: redis://redis:6379/0
    ports: ["8002:8002"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      promtail: {condition: service_started}
      runtime-actuator-order: {condition: service_started}
    logging:
      driver: syslog
      options:
        syslog-address: ${PROMTAIL_SYSLOG_ADDRESS:-tcp+tls://host.docker.internal:1514}
        syslog-format: rfc5424micro
        syslog-tls-ca-cert: ${RUNTIME_LOG_SECRET_DIR:-/Users/yaphet/code/OpsPilot/work/runtime-log-secrets}/current/clients/order-service/ca.pem
        syslog-tls-cert: ${RUNTIME_LOG_SECRET_DIR:-/Users/yaphet/code/OpsPilot/work/runtime-log-secrets}/current/clients/order-service/cert.pem
        syslog-tls-key: ${RUNTIME_LOG_SECRET_DIR:-/Users/yaphet/code/OpsPilot/work/runtime-log-secrets}/current/clients/order-service/key.pem
        syslog-tls-skip-verify: "false"
        tag: '${COMPOSE_PROJECT_NAME:-opspilot}|order-service'

  payment-service:
    <<: *service-common
    pid: service:runtime-actuator-payment
    build:
      context: .
      dockerfile: apps/payment-service/Dockerfile
    environment:
      SERVICE_NAME: payment-service
      PORT: 8003
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: opspilot
      MYSQL_PASSWORD: opspilot
      MYSQL_DATABASE: opspilot
      REDIS_URL: redis://redis:6379/0
    ports: ["8003:8003"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      promtail: {condition: service_started}
      runtime-actuator-payment: {condition: service_started}
    logging:
      driver: syslog
      options:
        syslog-address: ${PROMTAIL_SYSLOG_ADDRESS:-tcp+tls://host.docker.internal:1514}
        syslog-format: rfc5424micro
        syslog-tls-ca-cert: ${RUNTIME_LOG_SECRET_DIR:-/Users/yaphet/code/OpsPilot/work/runtime-log-secrets}/current/clients/payment-service/ca.pem
        syslog-tls-cert: ${RUNTIME_LOG_SECRET_DIR:-/Users/yaphet/code/OpsPilot/work/runtime-log-secrets}/current/clients/payment-service/cert.pem
        syslog-tls-key: ${RUNTIME_LOG_SECRET_DIR:-/Users/yaphet/code/OpsPilot/work/runtime-log-secrets}/current/clients/payment-service/key.pem
        syslog-tls-skip-verify: "false"
        tag: '${COMPOSE_PROJECT_NAME:-opspilot}|payment-service'

  control-api:
    <<: *service-common
    build:
      context: .
      dockerfile: apps/control-api/Dockerfile
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      DATABASE_PATH: /data/opspilot.db
      EXECUTOR_GATEWAY_URL: http://executor-gateway:8090
      WORKLOAD_IDENTITY_ISSUER_URL: http://workload-identity-issuer:8085
      WORKLOAD_IDENTITY_PRIVATE_KEY_FILE: /identity/control-private/private.pem
      EXECUTOR_IDENTITY_TTL_SECONDS: ${EXECUTOR_IDENTITY_TTL_SECONDS:-10}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_TIMEOUT: ${EMBEDDING_TIMEOUT:-10}
      SEMANTIC_MINIMUM_SIMILARITY: ${SEMANTIC_MINIMUM_SIMILARITY:-0.75}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-90}
      LLM_THINK: ${LLM_THINK:-false}
      VERIFICATION_MAX_ATTEMPTS: ${VERIFICATION_MAX_ATTEMPTS:-6}
      VERIFICATION_CHECK_INTERVAL_SECONDS: ${VERIFICATION_CHECK_INTERVAL_SECONDS:-2}
      VERIFICATION_SERVICE_HEALTH_CONDITION: ${VERIFICATION_SERVICE_HEALTH_CONDITION:-healthy}
      VERIFICATION_DEPENDENCY_METRIC_THRESHOLD: ${VERIFICATION_DEPENDENCY_METRIC_THRESHOLD:-1}
      VERIFICATION_RECOVERY_STABLE_CHECKS: ${VERIFICATION_RECOVERY_STABLE_CHECKS:-1}
      VERIFICATION_SERVICE_POLICIES: '${VERIFICATION_SERVICE_POLICIES:-{}}'
      VERIFICATION_POLICY_FILE: /etc/opspilot/verification-policies.json
      VERIFICATION_POLICY_SIGNING_KEYS: '${VERIFICATION_POLICY_SIGNING_KEYS:-{}}'
      VERIFICATION_POLICY_REQUIRE_SIGNATURE: ${VERIFICATION_POLICY_REQUIRE_SIGNATURE:-false}
      VERIFICATION_POLICY_DISTRIBUTION_URL: ${VERIFICATION_POLICY_DISTRIBUTION_URL:-}
      VERIFICATION_POLICY_DISTRIBUTION_TOKEN: ${VERIFICATION_POLICY_DISTRIBUTION_TOKEN:-}
      VERIFICATION_POLICY_DISTRIBUTION_TIMEOUT: ${VERIFICATION_POLICY_DISTRIBUTION_TIMEOUT:-2}
      VERIFICATION_POLICY_DISTRIBUTION_POLL_INTERVAL: ${VERIFICATION_POLICY_DISTRIBUTION_POLL_INTERVAL:-2}
      VERIFICATION_POLICY_NODE_ID: ${VERIFICATION_POLICY_NODE_ID:-control-api}
      VERIFICATION_POLICY_ROLLOUT_NODES: '${VERIFICATION_POLICY_ROLLOUT_NODES:-{}}'
      VERIFICATION_POLICY_ROLLOUT_TIMEOUT: ${VERIFICATION_POLICY_ROLLOUT_TIMEOUT:-2}
      VERIFICATION_POLICY_ROLLOUT_MAX_CONCURRENCY: ${VERIFICATION_POLICY_ROLLOUT_MAX_CONCURRENCY:-4}
      VERIFICATION_POLICY_PEER_IDENTITY_KEY: ${VERIFICATION_POLICY_PEER_IDENTITY_KEY:-opspilot-local-policy-peer-key}
      VERIFICATION_POLICY_PEER_IDENTITY_KEY_ID: ${VERIFICATION_POLICY_PEER_IDENTITY_KEY_ID:-verification-policy-peer-v1}
      VERIFICATION_POLICY_PEER_IDENTITY_TTL_SECONDS: ${VERIFICATION_POLICY_PEER_IDENTITY_TTL_SECONDS:-10}
    ports: ["8080:8080"]
    volumes:
      - control-data:/data
      - ./infra/opspilot:/etc/opspilot:ro
      - workload-control-private:/identity/control-private:ro
    depends_on: [prometheus, loki, alertmanager, executor-gateway, workload-identity-issuer]

  policy-distributor:
    <<: *service-common
    profiles: [policy-rollout]
    build:
      context: .
      dockerfile: apps/policy-distributor/Dockerfile
    environment:
      VERIFICATION_POLICY_BUNDLE_FILE: /policy/bundle.json
      VERIFICATION_POLICY_DISTRIBUTION_TOKEN: ${VERIFICATION_POLICY_DISTRIBUTION_TOKEN:-opspilot-local-policy-distribution-token}
    volumes:
      - ./infra/opspilot/verification-policy-distribution.json:/policy/bundle.json:ro

  control-api-canary:
    <<: *service-common
    profiles: [policy-rollout]
    build:
      context: .
      dockerfile: apps/control-api/Dockerfile
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      DATABASE_PATH: /data/opspilot.db
      EXECUTOR_GATEWAY_URL: http://executor-gateway:8090
      WORKLOAD_IDENTITY_ISSUER_URL: http://workload-identity-issuer:8085
      WORKLOAD_IDENTITY_PRIVATE_KEY_FILE: /identity/control-private/private.pem
      EXECUTOR_IDENTITY_TTL_SECONDS: ${EXECUTOR_IDENTITY_TTL_SECONDS:-10}
      VERIFICATION_MAX_ATTEMPTS: ${VERIFICATION_MAX_ATTEMPTS:-6}
      VERIFICATION_CHECK_INTERVAL_SECONDS: ${VERIFICATION_CHECK_INTERVAL_SECONDS:-2}
      VERIFICATION_SERVICE_HEALTH_CONDITION: ${VERIFICATION_SERVICE_HEALTH_CONDITION:-healthy}
      VERIFICATION_DEPENDENCY_METRIC_THRESHOLD: ${VERIFICATION_DEPENDENCY_METRIC_THRESHOLD:-1}
      VERIFICATION_RECOVERY_STABLE_CHECKS: ${VERIFICATION_RECOVERY_STABLE_CHECKS:-1}
      VERIFICATION_SERVICE_POLICIES: '${VERIFICATION_SERVICE_POLICIES:-{}}'
      VERIFICATION_POLICY_FILE: /etc/opspilot/verification-policies.json
      VERIFICATION_POLICY_SIGNING_KEYS: '${VERIFICATION_POLICY_SIGNING_KEYS:-{}}'
      VERIFICATION_POLICY_REQUIRE_SIGNATURE: ${VERIFICATION_POLICY_REQUIRE_SIGNATURE:-false}
      VERIFICATION_POLICY_DISTRIBUTION_URL: ${VERIFICATION_POLICY_DISTRIBUTION_URL:-}
      VERIFICATION_POLICY_DISTRIBUTION_TOKEN: ${VERIFICATION_POLICY_DISTRIBUTION_TOKEN:-}
      VERIFICATION_POLICY_DISTRIBUTION_TIMEOUT: ${VERIFICATION_POLICY_DISTRIBUTION_TIMEOUT:-2}
      VERIFICATION_POLICY_DISTRIBUTION_POLL_INTERVAL: ${VERIFICATION_POLICY_DISTRIBUTION_POLL_INTERVAL:-2}
      VERIFICATION_POLICY_NODE_ID: control-api-canary
      VERIFICATION_POLICY_ROLLOUT_NODES: '{}'
      VERIFICATION_POLICY_ROLLOUT_TIMEOUT: ${VERIFICATION_POLICY_ROLLOUT_TIMEOUT:-2}
      VERIFICATION_POLICY_ROLLOUT_MAX_CONCURRENCY: ${VERIFICATION_POLICY_ROLLOUT_MAX_CONCURRENCY:-4}
      VERIFICATION_POLICY_PEER_IDENTITY_KEY: ${VERIFICATION_POLICY_PEER_IDENTITY_KEY:-opspilot-local-policy-peer-key}
      VERIFICATION_POLICY_PEER_IDENTITY_KEY_ID: ${VERIFICATION_POLICY_PEER_IDENTITY_KEY_ID:-verification-policy-peer-v1}
      VERIFICATION_POLICY_PEER_IDENTITY_TTL_SECONDS: ${VERIFICATION_POLICY_PEER_IDENTITY_TTL_SECONDS:-10}
    volumes:
      - control-canary-data:/data
      - ./infra/opspilot:/etc/opspilot:ro
      - workload-control-private:/identity/control-private:ro
    depends_on: [prometheus, loki, alertmanager, executor-gateway, policy-distributor]

  executor-gateway:
    <<: *service-common
    build:
      context: .
      dockerfile: apps/executor-gateway/Dockerfile
    environment:
      RUNTIME_EXECUTOR_URL: http://runtime-executor:2375
      WORKLOAD_IDENTITY_ISSUER_URL: http://workload-identity-issuer:8085
      WORKLOAD_IDENTITY_PRIVATE_KEY_FILE: /identity/gateway-private/private.pem
      WORKLOAD_IDENTITY_PUBLIC_KEY_FILE: /identity/issuer-public/public.pem
      EXECUTOR_IDENTITY_MAX_TTL_SECONDS: ${EXECUTOR_IDENTITY_MAX_TTL_SECONDS:-15}
      EXECUTOR_DATABASE_PATH: /data/executor.db
    volumes:
      - executor-data:/data
      - workload-gateway-private:/identity/gateway-private:ro
      - workload-issuer-public:/identity/issuer-public:ro
    networks: [opspilot, executor-runtime]
    depends_on: [runtime-executor, workload-identity-issuer]

  runtime-executor:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/runtime-executor/Dockerfile
    environment:
      WORKLOAD_IDENTITY_PUBLIC_KEY_FILE: /identity/issuer-public/public.pem
      RUNTIME_EXECUTOR_DATABASE_PATH: /data/runtime-executor.db
      RUNTIME_EXECUTOR_PLACEMENT: local-compose
      RUNTIME_EXECUTOR_ID: runtime-executor-local
    volumes:
      - workload-issuer-public:/identity/issuer-public:ro
      - runtime-executor-data:/data
      - actuator-redis:/run/actuators/redis
      - actuator-mysql:/run/actuators/mysql
      - actuator-user:/run/actuators/user-service
      - actuator-order:/run/actuators/order-service
      - actuator-payment:/run/actuators/payment-service
    networks: [executor-runtime]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      - runtime-actuator-redis
      - runtime-actuator-mysql
      - runtime-actuator-user
      - runtime-actuator-order
      - runtime-actuator-payment

  runtime-audit-db:
    profiles: [orchestrator-runtime]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: opspilot_runtime
      POSTGRES_USER: opspilot_runtime
      POSTGRES_PASSWORD: opspilot_runtime_local
    volumes: [runtime-audit-data:/var/lib/postgresql/data]
    networks: [executor-runtime]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot_runtime -d opspilot_runtime"]
      interval: 3s
      timeout: 2s
      retries: 20

  workload-identity-issuer-orchestrated:
    profiles: [orchestrator-runtime]
    build:
      context: .
      dockerfile: apps/workload-identity-issuer/Dockerfile
    environment:
      WORKLOAD_IDENTITY_SIGNING_KEY_FILE: /identity/issuer-private/private.pem
      WORKLOAD_IDENTITY_DATABASE_PATH: /data/issuer.db
      WORKLOAD_IDENTITY_CLIENT_KEYS: '{"executor-gateway":"/identity/gateway-public/public.pem"}'
      WORKLOAD_IDENTITY_TARGET_PLACEMENTS: '{"redis":"kubernetes/opspilot/redis"}'
    volumes:
      - workload-issuer-private:/identity/issuer-private:ro
      - workload-gateway-public:/identity/gateway-public:ro
      - orchestrated-issuer-data:/data
    networks: [executor-runtime]
    depends_on:
      workload-identity-bootstrap: {condition: service_completed_successfully}

  runtime-executor-redis-a:
    profiles: [orchestrator-runtime]
    build:
      context: .
      dockerfile: apps/runtime-executor/Dockerfile
    environment:
      WORKLOAD_IDENTITY_PUBLIC_KEY_FILE: /identity/issuer-public/public.pem
      RUNTIME_EXECUTOR_DATABASE_URL: postgresql://opspilot_runtime:opspilot_runtime_local@runtime-audit-db:5432/opspilot_runtime
      RUNTIME_EXECUTOR_PLACEMENT: kubernetes/opspilot/redis
      RUNTIME_EXECUTOR_ID: runtime-executor-redis-a
      RUNTIME_EXECUTOR_TARGETS: redis
    volumes:
      - workload-issuer-public:/identity/issuer-public:ro
      - actuator-redis:/run/actuators/redis
    networks: [executor-runtime]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      runtime-audit-db: {condition: service_healthy}
      runtime-actuator-redis: {condition: service_started}

  runtime-executor-redis-b:
    profiles: [orchestrator-runtime]
    build:
      context: .
      dockerfile: apps/runtime-executor/Dockerfile
    environment:
      WORKLOAD_IDENTITY_PUBLIC_KEY_FILE: /identity/issuer-public/public.pem
      RUNTIME_EXECUTOR_DATABASE_URL: postgresql://opspilot_runtime:opspilot_runtime_local@runtime-audit-db:5432/opspilot_runtime
      RUNTIME_EXECUTOR_PLACEMENT: kubernetes/opspilot/redis
      RUNTIME_EXECUTOR_ID: runtime-executor-redis-b
      RUNTIME_EXECUTOR_TARGETS: redis
    volumes:
      - workload-issuer-public:/identity/issuer-public:ro
      - actuator-redis:/run/actuators/redis
    networks: [executor-runtime]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      runtime-audit-db: {condition: service_healthy}
      runtime-actuator-redis: {condition: service_started}

  runtime-actuator-redis:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/runtime-actuator/Dockerfile
    environment:
      RUNTIME_ACTUATOR_TARGET: redis
      RUNTIME_ACTUATOR_ALLOW_STOP: "true"
      RUNTIME_ACTUATOR_PROCESS_MATCH: "redis-server"
    network_mode: none
    cap_drop: [ALL]
    cap_add: [KILL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    volumes: [actuator-redis:/run/opspilot]

  runtime-actuator-mysql:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/runtime-actuator/Dockerfile
    environment:
      RUNTIME_ACTUATOR_TARGET: mysql
      RUNTIME_ACTUATOR_ALLOW_STOP: "true"
      RUNTIME_ACTUATOR_PROCESS_MATCH: "mysqld"
    network_mode: none
    cap_drop: [ALL]
    cap_add: [KILL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    volumes: [actuator-mysql:/run/opspilot]

  runtime-actuator-user:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/runtime-actuator/Dockerfile
    environment:
      RUNTIME_ACTUATOR_TARGET: user-service
      RUNTIME_ACTUATOR_PROCESS_MATCH: "/usr/local/bin/python3.11 /usr/local/bin/uvicorn app:app --host"
    network_mode: none
    cap_drop: [ALL]
    cap_add: [KILL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    volumes: [actuator-user:/run/opspilot]

  runtime-actuator-order:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/runtime-actuator/Dockerfile
    environment:
      RUNTIME_ACTUATOR_TARGET: order-service
      RUNTIME_ACTUATOR_PROCESS_MATCH: "/usr/local/bin/python3.11 /usr/local/bin/uvicorn app:app --host"
    network_mode: none
    cap_drop: [ALL]
    cap_add: [KILL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    volumes: [actuator-order:/run/opspilot]

  runtime-actuator-payment:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/runtime-actuator/Dockerfile
    environment:
      RUNTIME_ACTUATOR_TARGET: payment-service
      RUNTIME_ACTUATOR_PROCESS_MATCH: "/usr/local/bin/python3.11 /usr/local/bin/uvicorn app:app --host"
    network_mode: none
    cap_drop: [ALL]
    cap_add: [KILL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    volumes: [actuator-payment:/run/opspilot]

  container-metrics-exporter:
    <<: *service-common
    build:
      context: .
      dockerfile: apps/container-metrics-exporter/Dockerfile
    environment:
      RUNTIME_EXECUTOR_URL: http://runtime-executor:2375
      WORKLOAD_IDENTITY_ISSUER_URL: http://workload-identity-issuer:8085
      WORKLOAD_IDENTITY_PRIVATE_KEY_FILE: /identity/metrics-private/private.pem
      CONTAINER_METRICS_TARGETS: user-service,order-service,payment-service
      CONTAINER_CPU_THRESHOLDS: '${CONTAINER_CPU_THRESHOLDS:-{"user-service":0.8,"order-service":0.8,"payment-service":0.8}}'
    networks: [opspilot, executor-runtime]
    volumes:
      - workload-metrics-private:/identity/metrics-private:ro
    depends_on: [runtime-executor, workload-identity-issuer]

  mysql:
    <<: *service-common
    pid: service:runtime-actuator-mysql
    image: mysql:8.4
    entrypoint: ["/bin/sh", "/usr/local/bin/opspilot-runtime-target-init", "/usr/local/bin/docker-entrypoint.sh"]
    command: ["mysqld"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: opspilot
      MYSQL_USER: opspilot
      MYSQL_PASSWORD: opspilot
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    configs:
      - source: runtime-target-init
        target: /usr/local/bin/opspilot-runtime-target-init
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      runtime-actuator-mysql: {condition: service_started}

  redis:
    <<: *service-common
    pid: service:runtime-actuator-redis
    image: redis:7.4-alpine
    entrypoint: ["/bin/sh", "/usr/local/bin/opspilot-runtime-target-init", "/usr/local/bin/docker-entrypoint.sh"]
    command: ["redis-server"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    depends_on:
      runtime-actuator-redis: {condition: service_started}
    configs:
      - source: runtime-target-init
        target: /usr/local/bin/opspilot-runtime-target-init

  prometheus:
    <<: *service-common
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks: [opspilot, executor-runtime]

  alertmanager:
    <<: *service-common
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    ports: ["9093:9093"]
    volumes:
      - ./infra/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager

  grafana:
    <<: *service-common
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports: ["3000:3000"]
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki]

  loki:
    <<: *service-common
    image: grafana/loki:3.5.3
    command: -config.file=/etc/loki/local-config.yaml
    ports: ["3100:3100"]
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  promtail:
    <<: *service-common
    build:
      context: .
      dockerfile: apps/promtail/Dockerfile
    ports: ["1514:1514"]
    volumes:
      - ./infra/loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - ${RUNTIME_LOG_SECRET_DIR:-./work/runtime-log-secrets}/current/gateway:/etc/promtail/pki:ro
    depends_on: [loki]

networks:
  opspilot: {}
  executor-runtime:
    internal: true

configs:
  runtime-target-init:
    file: ./scripts/runtime-target-init.sh

volumes:
  mysql-data: {}
  prometheus-data: {}
  grafana-data: {}
  loki-data: {}
  alertmanager-data: {}
  control-data: {}
  control-canary-data: {}
  executor-data: {}
  runtime-executor-data: {}
  runtime-audit-data: {}
  orchestrated-issuer-data: {}
  actuator-redis: {}
  actuator-mysql: {}
  actuator-user: {}
  actuator-order: {}
  actuator-payment: {}
  workload-issuer-data: {}
  workload-issuer-private: {}
  workload-issuer-public: {}
  workload-control-private: {}
  workload-control-public: {}
  workload-gateway-private: {}
  workload-gateway-public: {}
  workload-metrics-private: {}
  workload-metrics-public: {}
